name: MeshNotch release

# Builds the MeshNotch AppImage on ubuntu-22.04 (oldest glibc GitHub still
# offers as a stock runner) so the artifact runs on the widest range of
# Linux distros, and attaches it to a GitHub Release. Trigger by pushing a
# tag like `meshnotch-v0.1.0`.
on:
  push:
    tags:
      - "meshnotch-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned exactly (not "^2.0") so the tauri-cli cache key below stays valid
  # across runs — bump this on purpose when you want a newer tauri-cli.
  TAURI_CLI_VERSION: "2.11.4"

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libfuse2 patchelf build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codenotch-linux -> target

      - name: Cache tauri-cli binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}

      - name: Install tauri-cli
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "=${{ env.TAURI_CLI_VERSION }}" --locked

      - name: Build AppImage
        working-directory: codenotch-linux/app
        # tauri.conf.json has an updater pubkey + createUpdaterArtifacts:
        # true, so `cargo tauri build` hard-errors (not skips) without a
        # private key — these secrets must stay here or the build fails.
        # The .sig produced here is for the pre-strip artifact and gets
        # overwritten by the "Sign AppImage" step below, after libwayland-*
        # is stripped and the AppImage is re-packed.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles appimage

      - name: Locate AppImage
        id: find
        # `app` is a workspace member, so cargo puts `target/` at the workspace
        # root (the codenotch-linux directory), not
        # under app/ — the "Cache cargo" step above already reflects this.
        run: |
          path=$(find target/release/bundle/appimage -iname "*.AppImage" | head -n1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "asset=$(basename "$path")" >> "$GITHUB_OUTPUT"
          echo "signature=$path.sig" >> "$GITHUB_OUTPUT"
        working-directory: codenotch-linux

      - name: Install appimagetool
        run: |
          curl -L -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage
          cd /tmp && ./appimagetool.AppImage --appimage-extract >/dev/null
          sudo ln -s /tmp/squashfs-root/AppRun /usr/local/bin/appimagetool

      - name: Strip bundled libwayland-* and re-pack
        # libwayland-client/cursor/egl/server are protocol/Mesa-coupled to
        # the host compositor and driver: bundling the ubuntu-22.04 runner's
        # version causes EGL_BAD_PARAMETER aborts in WebKitGTK on newer host
        # Mesa (confirmed via LD_PRELOAD A/B test). The official AppImage
        # excludelist agrees these must come from the host.
        working-directory: codenotch-linux
        run: |
          appimage="${{ steps.find.outputs.path }}"
          work_dir=$(mktemp -d)
          cp "$appimage" "$work_dir/repack.AppImage"
          (
            cd "$work_dir"
            chmod +x repack.AppImage
            ./repack.AppImage --appimage-extract >/dev/null
            rm -f squashfs-root/usr/lib/libwayland-client.so* \
                  squashfs-root/usr/lib/libwayland-cursor.so* \
                  squashfs-root/usr/lib/libwayland-egl.so* \
                  squashfs-root/usr/lib/libwayland-server.so*
            ARCH=x86_64 appimagetool squashfs-root out.AppImage
          )
          mv "$work_dir/out.AppImage" "$appimage"
          rm -rf "$work_dir"

      - name: Sign AppImage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "${{ steps.find.outputs.path }}"
        working-directory: codenotch-linux

      - name: Generate updater manifest
        env:
          VERSION: ${{ github.ref_name }}
          ASSET: ${{ steps.find.outputs.asset }}
          SIGNATURE_PATH: codenotch-linux/${{ steps.find.outputs.signature }}
        run: |
          version="${VERSION#meshnotch-v}"
          signature=$(cat "$SIGNATURE_PATH")
          jq -n \
            --arg version "$version" \
            --arg notes "MeshNotch ${version}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/NatanBack77/agentmesh/releases/download/${VERSION}/${ASSET}" \
            --arg signature "$signature" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"linux-x86_64": {url: $url, signature: $signature}}}' \
            > codenotch-linux/target/release/bundle/latest.json

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            codenotch-linux/${{ steps.find.outputs.path }}
            codenotch-linux/${{ steps.find.outputs.signature }}
            codenotch-linux/target/release/bundle/latest.json
          generate_release_notes: true
