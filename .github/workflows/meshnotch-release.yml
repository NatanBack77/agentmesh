name: MeshNotch release

# Builds the MeshNotch AppImage on ubuntu-22.04 (oldest glibc GitHub still
# offers as a stock runner) so the artifact runs on the widest range of
# Linux distros, and attaches it to a GitHub Release. Trigger by pushing a
# tag like `meshnotch-v0.1.0`.
on:
  push:
    tags:
      - "meshnotch-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev libfuse2 patchelf build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: codenotch-linux -> target

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.0" --locked

      - name: Build AppImage
        working-directory: codenotch-linux/app
        run: cargo tauri build --bundles appimage

      - name: Locate AppImage
        id: find
        run: |
          path=$(find target/release/bundle/appimage -iname "*.AppImage" | head -n1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
        working-directory: codenotch-linux/app

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: codenotch-linux/app/${{ steps.find.outputs.path }}
          generate_release_notes: true
