      let latestState = { providers: [], sessions: [], enabled_providers: ["claude", "codex", "cursor"], agentmesh: { connected: false, quotas: [] } };
      let openTooltipFor = null;
      let dragArmed = false;

      function runtimeGlyph(id) {

      }

      function addProviderRing(provider) {
        if (!provider?.id || notchBody.querySelector(`.ring[data-provider="${provider.id}"]`)) return;
        const item = document.createElement("div");
        item.className = "ring-item";
        item.dataset.provider = provider.id;
        const color = PROVIDER_COLORS[provider.id] || "#0a84ff";
        item.innerHTML = `
          <button class="ring" type="button" data-provider="${provider.id}" data-status="absent" aria-label="${provider.label || provider.name || provider.id}">
            <svg viewBox="0 0 34 34" aria-hidden="true">
              <circle class="ring-track" cx="17" cy="17" r="14"></circle>
              <circle class="ring-fill" cx="17" cy="17" r="14" style="--ring-color:${color}; stroke-dasharray:88; stroke-dashoffset:88;"></circle>
              <circle class="ring-week-track" cx="17" cy="17" r="10"></circle>
              <circle class="ring-week-fill" cx="17" cy="17" r="10" style="--ring-color:${color}; stroke-dasharray:63; stroke-dashoffset:63;"></circle>
            </svg>
            <span class="ring-glyph" aria-hidden="true">${runtimeGlyph(provider.id)}</span>
          </button>
          ${provider.kind === "LocalRuntime" ? '<span class="runtime-state"><i aria-hidden="true"></i><small>OFF</small></span>' : `<span class="ring-pct"><strong id="pct-${provider.id}-session">--</strong><small id="pct-${provider.id}-week"> / --</small></span>`}`;
        notchBody.insertBefore(item, meshChip);
        const button = item.querySelector(".ring");
        rings.push(button);
        bindRing(button);
      }

      function syncProviderRings() {
        (latestState.providers || []).forEach(addProviderRing);
      }

      function formatResetsAt(ms) {
        if (!ms) return null;
        const diff = ms - Date.now();
        if (diff <= 0) return "resetando agora";
        const minutes = Math.round(diff / 60000);
        if (minutes < 60) return `Resets in ${minutes} min`;
        const hours = Math.round(minutes / 60);
        if (hours < 48) return `Resets in ${hours}h`;
        const days = Math.round(hours / 24);
        return `Resets in ${days}d`;
      }

      function formatReset(value) {
        if (!value) return null;
        const parsed = typeof value === "number"
          ? (value < 100000000000 ? value * 1000 : value)
          : Date.parse(value);
        return Number.isFinite(parsed) ? formatResetsAt(parsed) : null;
      }

      function clampPct(value) {
        return typeof value === "number" && Number.isFinite(value) ? Math.min(100, Math.max(0, value)) : null;
      }

      function quotaFor(providerId, provider) {
        const mesh = latestState.agentmesh;
        if (mesh?.connected) {
          const quota = (mesh.quotas || []).find((item) => item.provider === providerId);
          if (!quota || !quota.available) return { source: "agentmesh", unavailable: true, error: quota?.error || "Quota indisponível" };
          return {
            source: "agentmesh",
            sessionPct: clampPct(quota.session_pct),
            weekPct: clampPct(quota.week_pct),
            sessionReset: formatReset(quota.session_resets_at),
            weekReset: formatReset(quota.week_resets_at),
            planType: quota.plan_type || ""
          };
        }

        const windows = provider?.windows || [];
        const session = windows[0];
        const week = windows[1];
        return {
          source: "local",
          sessionPct: typeof session?.used === "number" ? clampPct(session.used * 100) : null,
          weekPct: typeof week?.used === "number" ? clampPct(week.used * 100) : null,
          sessionReset: formatReset(session?.resets_at),
          weekReset: formatReset(week?.resets_at),
          planType: ""
        };
      }

      function sessionState(providerId) {
        const sessions = (latestState.sessions || []).filter((s) => s.provider === providerId);
        if (sessions.some((s) => s.state === "busy")) return "busy";
        if (sessions.some((s) => s.state === "waiting")) return "waiting";
        if (sessions.length) return "done";
        return "idle";
      }

      function paintRing(button) {
        const providerId = button.dataset.provider;
        const item = button.closest(".ring-item");
        const enabled = (latestState.enabled_providers || []).includes(providerId);
        if (item) item.hidden = !enabled;
        if (!enabled) return;

        const provider = (latestState.providers || []).find((p) => p.id === providerId);
        if (provider?.kind === "LocalRuntime") {
          item?.classList.add("local-runtime");
          const runtimeState = item?.querySelector(".runtime-state");
          const active = Boolean(provider.running);
          button.dataset.status = provider.status || (active ? "running" : provider.available ? "available" : "absent");
          button.title = provider.note || (active ? `${provider.label || provider.name} running` : provider.available ? `${provider.label || provider.name} disponível` : `${provider.label || provider.name} indisponível`);
          if (runtimeState) {
            runtimeState.classList.toggle("is-running", active);
            runtimeState.querySelector("small").textContent = active ? "ON" : provider.available ? "READY" : "OFF";
          }
          if (openTooltipFor === providerId) renderTooltip(providerId, button);
          return;
        }
        item?.classList.remove("local-runtime");
        const fill = button.querySelector(".ring-fill");
        const weekFill = button.querySelector(".ring-week-fill");
        const quota = quotaFor(providerId, provider);
        const sessionPct = quota.sessionPct ?? 0;
        const weekPct = quota.weekPct ?? 0;
        fill.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - sessionPct / 100));
        weekFill.style.strokeDashoffset = String(WEEK_CIRCUMFERENCE * (1 - weekPct / 100));
        const sessionLabel = document.getElementById(`pct-${providerId}-session`);
        const weekLabel = document.getElementById(`pct-${providerId}-week`);
        if (sessionLabel) sessionLabel.textContent = quota.sessionPct == null ? "--" : `${Math.round(sessionPct)}%`;
        if (weekLabel) weekLabel.textContent = quota.weekPct == null ? " / --" : ` / ${Math.round(weekPct)}%`;
        button.dataset.quotaSource = quota.source;
        button.dataset.quotaUnavailable = String(Boolean(quota.unavailable));

        const activity = sessionState(providerId);
        const status = provider && provider.status !== "ok" && provider.status !== "absent" ? provider.status : activity;
        button.dataset.status = status;
        button.title = provider?.note || provider?.name || providerId;
        if (openTooltipFor === providerId) renderTooltip(providerId, button);
      }

      function usageBlock(w) {
        const pct = Math.round((w.used || 0) * 100);
        const resets = formatResetsAt(w.resets_at) || "";
        const barColor = pct >= 90 ? "#ff453a" : pct >= 60 ? "#ff9f0a" : "#32d74b";
        return `
          <div class="usage-block">
            <div class="usage-row"><span>${w.label || w.id}</span><strong>${resets}</strong></div>
            <div class="usage-bar"><span style="width:${pct}%; --bar-color:${barColor}"></span></div>
            <div class="usage-pct">${pct}% Used</div>
          </div>`;
      }

      function quotaBlock(quota) {
        if (quota.unavailable) return `<p class="empty-note">${quota.error}</p>`;
        const session = Math.round(quota.sessionPct || 0);
        const week = Math.round(quota.weekPct || 0);
        const sessionColor = session >= 90 ? "#ff453a" : session >= 60 ? "#ff9f0a" : "#32d74b";
        const weekColor = week >= 90 ? "#ff453a" : week >= 60 ? "#ff9f0a" : "#64d2ff";
        const plan = quota.planType ? `<span class="quota-plan">${quota.planType}</span>` : "";
        return `
          <div class="quota-source">AgentMesh${plan}</div>
          <div class="usage-block">
            <div class="usage-row"><span>Sessão</span><strong>${quota.sessionReset || "sem reset"}</strong></div>
            <div class="usage-bar"><span style="width:${session}%; --bar-color:${sessionColor}"></span></div>
            <div class="usage-pct">${session}% usado</div>
          </div>
          <div class="usage-block">
            <div class="usage-row"><span>Semana</span><strong>${quota.weekReset || "sem reset"}</strong></div>
            <div class="usage-bar"><span style="width:${week}%; --bar-color:${weekColor}"></span></div>
            <div class="usage-pct">${week}% usado</div>
          </div>`;
      }

      function runtimeBlock(provider) {
        const label = provider?.label || provider?.name || provider?.id || "Runtime";
        const state = provider?.running ? "Rodando" : provider?.available ? "Disponível" : "Indisponível";
        const note = provider?.note || (provider?.running ? "Processo detectado" : "Nenhum processo detectado");
        return `<div class="runtime-tooltip-state"><i class="${provider?.running ? "is-running" : ""}"></i><strong>${state}</strong></div><p class="empty-note">${label}: ${note}</p>`;
      }

      function renderTooltip(providerId, button) {
        const provider = (latestState.providers || []).find((p) => p.id === providerId);
        const sessions = (latestState.sessions || []).filter((s) => s.provider === providerId);
        const quota = quotaFor(providerId, provider);
        const name = PROVIDER_NAME[providerId] || provider?.name || providerId;
        const glyph = button.querySelector(".ring-glyph")?.innerHTML || "";
        const ringColor = getComputedStyle(button.querySelector(".ring-fill")).getPropertyValue("--ring-color") || "#0a84ff";

        const body = provider?.kind === "LocalRuntime"
          ? runtimeBlock(provider)
          : quota.source === "agentmesh"
          ? quotaBlock(quota)
          : (provider?.windows || []).length
          ? provider.windows.map(usageBlock).join("")
          : `<p class="empty-note">${provider?.note || "Sem dados de uso ainda"}</p>`;

        const sessionHtml = sessions.length
          ? `<div class="session-row">${sessions[0].state} · ${sessions[0].prompt || sessions[0].cwd || sessions[0].id}</div>`
          : "";

        const usageTitle = provider?.kind === "LocalRuntime" ? "Runtime" : "Usage";
        tooltip.innerHTML = `
          <div class="ring-tooltip-head">
            <span class="ring-tooltip-glyph" style="--ring-color:${ringColor}">${glyph}</span>
            <h3>${name} ${usageTitle}</h3>
          </div>
          ${body}${sessionHtml}`;

        const rect = button.getBoundingClientRect();
        const horizontal = document.documentElement.dataset.orientation === "horizontal";
        if (horizontal) {
          tooltip.style.top = `${rect.bottom}px`;
          tooltip.style.left = `${rect.left + rect.width / 2}px`;
        } else {
          tooltip.style.top = `${rect.top + rect.height / 2}px`;
          tooltip.style.left = `${rect.left}px`;
        }
        tooltip.classList.add("is-visible");
      }

      function hideTooltip() {
        openTooltipFor = null;
        tooltip.classList.remove("is-visible");
      }

      function bindRing(button) {
        button.addEventListener("pointerenter", () => {
          if (button.hidden) return;
          openTooltipFor = button.dataset.provider;
          renderTooltip(button.dataset.provider, button);
        });
        button.addEventListener("pointerleave", () => {
          if (openTooltipFor === button.dataset.provider) hideTooltip();
        });
        button.addEventListener("click", () => invoke("open_provider_page", { provider: button.dataset.provider }));
        button.addEventListener("focus", () => {
          if (button.hidden) return;
          openTooltipFor = button.dataset.provider;
          renderTooltip(button.dataset.provider, button);
        });
        button.addEventListener("blur", () => {
          if (openTooltipFor === button.dataset.provider) hideTooltip();
        });
      }
      rings.forEach(bindRing);

      meshChip.addEventListener("click", () => invoke("open_agentmesh_dashboard"));

      notchBody.addEventListener("pointerenter", () => notchBody.classList.add("is-open"));
      notchBody.addEventListener("pointerleave", () => {
        notchBody.classList.remove("is-open");
        hideTooltip();
      });

      document.getElementById("settings-orb")?.addEventListener("click", () => invoke("open_settings"));

      // Free dragging: pressing anywhere on the pill that isn't a button
      // starts an OS-level interactive move (see drag_begin in main.rs).
      notchColumn.addEventListener("pointerdown", (event) => {
        if (event.target.closest("button")) return;
        dragArmed = true;
        invoke("drag_begin");
      });
      window.addEventListener("pointerup", () => { dragArmed = false; });

      document.addEventListener("codenotch:state", (event) => {
        latestState = event.detail || latestState;
        syncProviderRings();
        if (latestState.orientation) document.documentElement.dataset.orientation = latestState.orientation;
        if (latestState.notch_style) notchBody.dataset.style = latestState.notch_style;
        if (latestState.accent_color) document.documentElement.style.setProperty("--accent", latestState.accent_color);
        rings.forEach(paintRing);

        const mesh = latestState.agentmesh;
        if (mesh && mesh.connected) {
          meshChip.hidden = false;
          meshCount.textContent = String(mesh.total_agents ?? 0);
          meshChip.dataset.attention = String((mesh.needs_attention || 0) > 0);
          meshChip.title = `AgentMesh: ${mesh.total_agents} agente(s), ${mesh.processing_agents} processando`;
        } else {
          meshChip.hidden = true;
        }
      });
      document.addEventListener("codenotch:activity", () => invoke("get_state").then((state) => {
        if (state) {
          latestState = state;
          rings.forEach(paintRing);
        }
      }));

      const rect = () => {
        const box = notchBody.getBoundingClientRect();
        const orb = document.getElementById("settings-orb")?.getBoundingClientRect();
        const boxes = [[box.x, box.y, box.width, box.height]];
        if (orb) boxes.push([orb.x, orb.y, orb.width, orb.height]);
        return boxes;
      };
      const sendHot = () => invoke("set_hot", { rects: rect(), expanded: notchBody.classList.contains("is-open") });
      notchBody.addEventListener("pointerenter", sendHot);
      notchBody.addEventListener("pointerleave", sendHot);
      window.addEventListener("resize", sendHot);
      sendHot();
    })();
  </script>
</body>
</html>
